behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    
    # Comportamientos activos cargados como plugins
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    
    # --- Configuración individual de cada comportamiento ---
    spin:
      plugin: "nav2_behaviors::Spin" # En Humble/Jazzy se utiliza "::"
      target_yaw: 1.57 # Ángulo a girar en radianes (~90°)
      
    backup:
      plugin: "nav2_behaviors::BackUp"
      backup_dist: 0.15 # Distancia a retroceder en metros
      backup_speed: 0.025 # Velocidad m/s
      
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      
    wait:
      plugin: "nav2_behaviors::Wait"
      wait_duration: 5 # Tiempo a esperar en segundos
      
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_accel_limit: 3.2s
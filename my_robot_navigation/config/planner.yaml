planner_server:
  ros__parameters:
    planner_plugins: ["GridBasedAStar", "GridBasedDijkstra"]
    use_sim_time: true
    
    GridBasedAStar:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: true
      tolerance: 0.5

    GridBasedDijkstra:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: false
      tolerance: 0.5
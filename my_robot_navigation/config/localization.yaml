#archivo de texto que guarda configuracion en formato de "etiqueta: valor".
#configura map_server + amcl (etapa localizacion).

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "my_living.yaml" #Apunta al yaml que describe el mapa

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.25
    update_min_a: 0.2
    laser_model_type: "likelihood_field"
    set_initial_pose: true